// ============ 供配电专业章节（含详细内容） ============
const gongpeiChapters = [
{ id: 'gp-1', title: '一、安全', points: ['1.1 熟悉工程建设标准强制性条文(电气专业)','1.2 理解电流对人体的效应','1.3 掌握安全电压及电击防护基本规定','1.4 掌握低压系统接地故障保护设计和等电位联结','1.5 掌握危险环境电力装置的特殊设计规定','1.6 理解电气设备防误操作规定及措施','1.7 掌握电气工程设计防火规定及措施','1.8 理解电力设施抗震设计和措施'],
content: `<h3>一、电流对人体的效应</h3>
<p>电流通过人体时会产生生理效应，其危险程度取决于<span class="highlight">电流大小、持续时间、电流路径和频率</span>。工频交流电（50Hz）对人体的危害最大。</p>
<p>根据GB/T 13870.1标准，电流对人体效应分为四个阈值：<b>感知阈</b>（约0.5mA）、<b>反应阈</b>（约0.5mA）、<b>摆脱阈</b>（约10mA，成年男性）、<b>心室纤维性颤动阈</b>（与电流大小和持续时间相关，遵循IEC曲线）。</p>
<h3>二、安全电压与电击防护</h3>
<p>安全电压等级：我国规定安全特低电压（SELV）为<b>交流50V、直流120V</b>（干燥场所）；潮湿场所为交流25V、直流60V。安全电压应由安全隔离变压器或独立电源供电。</p>
<p>电击防护措施分为<b>直接接触防护</b>和<b>间接接触防护</b>：</p>
<ul><li>直接接触：绝缘、遮拦/外护物、阻挡物、置于伸臂范围之外、剩余电流保护（RCD）</li><li>间接接触：自动切断电源、双重绝缘/加强绝缘、非导电场所、不接地的局部等电位联结、电气隔离</li></ul>
<h3>三、低压系统接地故障保护</h3>
<p>低压配电系统接地型式分为TN、TT、IT三类。TN系统又分为TN-S、TN-C、TN-C-S三种。</p>
<div class="formula">TN系统：Zs × Ia ≤ Uo &nbsp;&nbsp;(Zs为故障回路阻抗，Ia为5s内切断电流，Uo为相电压)</div>
<p>等电位联结分为<b>总等电位联结（MEB）</b>和<b>辅助等电位联结（SEB）</b>。MEB应将PE干线、接地干线、建筑物金属管道等在进线处连接。</p>
<h3>四、危险环境电力装置</h3>
<p>爆炸危险环境分区：0区（连续存在）、1区（正常运行时可能存在）、2区（正常运行时不太可能出现）。对应电气设备防爆型式：本质安全型（ia/ib）、隔爆型（d）、增安型（e）等。</p>
<div class="tip">考试重点：电击防护的五种间接接触措施适用条件；TN/TT/IT系统接地故障保护动作特性计算；等电位联结的范围和要求。</div>`
},
{ id: 'gp-2', title: '二、环境保护与节能', points: ['2.1 熟悉电气设备对环境影响及防治措施','2.2 熟悉供配电系统设计节能措施','2.3 熟悉提高电能质量措施','2.4 掌握节能型电气产品选用措施'],
content: `<h3>一、电气设备对环境影响</h3>
<p>电气设备运行对环境的主要影响包括：<b>电磁干扰</b>（EMI）、<b>噪声</b>（变压器运行噪声）、<b>热污染</b>、<b>光污染</b>（夜间照明）以及<b>废弃物</b>（废旧电池、含多氯联苯的变压器油等）。</p>
<p>防治措施：选用低噪声变压器、合理布置变配电所位置、采用EMC兼容设备、做好废油回收处理。</p>
<h3>二、供配电系统节能设计</h3>
<p>供配电系统节能的核心是<b>降低线路损耗和变压器损耗</b>：</p>
<ul><li>变配电所靠近负荷中心，缩短供电半径</li><li>提高供电电压等级，降低线路电流</li><li>采用低损耗变压器（S11、S13、非晶合金变压器）</li><li>功率因数补偿至0.9以上，减少无功电流</li><li>三相负荷平衡，降低中性线电流</li></ul>
<h3>三、提高电能质量措施</h3>
<p>电能质量指标包括：电压偏差、电压波动与闪变、谐波、三相不平衡度、频率偏差。</p>
<p>改善措施：合理选择变压器分接头、采用有载调压变压器、安装静止无功补偿器（SVC）或静止同步补偿器（STATCOM）、加装滤波器（无源/有源）。</p>
<h3>四、节能型电气产品选用</h3>
<p>选用高效节能的变压器、电动机（IE3/IE4效率等级）、LED照明、变频调速装置。电动机节能重点在于：合理选择电动机功率（负载率宜在75%-100%）、采用变频调速、功率因数就地补偿。</p>
<div class="tip">考试重点：变压器经济运行区间（负载率40%-70%）；线路损耗计算公式 ΔP = 3I²R；无功补偿容量计算。</div>`
},
{ id: 'gp-3', title: '三、负荷分级及计算', points: ['3.1 掌握负荷分级原则及供电要求','3.2 掌握负荷计算方法(需要系数法、利用系数法、单位指标法)'],
content: `<h3>一、负荷分级</h3>
<p>根据GB 50052，电力负荷分为三级：</p>
<ul><li><b>一级负荷</b>：中断供电将造成人身伤亡、重大经济损失、公共场所秩序严重混乱。应由双重电源供电，特别重要负荷还需增设应急电源。</li><li><b>二级负荷</b>：中断供电将造成较大经济损失、公共场所秩序混乱。宜由双重电源供电。</li><li><b>三级负荷</b>：不属于一、二级负荷者。单电源供电即可。</li></ul>
<h3>二、需要系数法</h3>
<p>最常用的负荷计算方法，适用于设备台数多、容量差别不大的场合。</p>
<div class="formula">设备功率：Pe = Ps/ηs（电动机）或 Pe = Sr×cosφ（电焊机）<br>计算有功功率：Pjs = Kx × Pe<br>计算无功功率：Qjs = Pjs × tanφ<br>计算视在功率：Sjs = √(Pjs² + Qjs²)<br>计算电流：Ijs = Sjs / (√3 × Un)</div>
<p>需要系数Kx取值参考《工业与民用供配电设计手册》（配四）附录。</p>
<h3>三、利用系数法</h3>
<p>适用于设备台数多、单台容量差别大的场合，计算结果更准确。</p>
<div class="formula">平均有功功率：Pav = Ku × Pe<br>平均无功功率：Qav = Pav × tanφ<br>有效台数：neq（根据最大容量设备与总容量比值确定）<br>最大系数：Km（根据neq和tanφ查曲线）<br>计算有功功率：Pjs = Km × Pav</div>
<h3>四、单位指标法</h3>
<p>适用于方案设计阶段或初步设计阶段。</p>
<div class="formula">Pjs = p' × A （单位面积功率法）或 Pjs = p'' × N （单位指标法）</div>
<div class="tip">考试重点：负荷分级判定的工程案例；需要系数法四步计算（设备功率→需要系数→同时系数→计算电流）；单相负荷换算为等效三相负荷。</div>`
},
{ id: 'gp-4', title: '四、110kV及以下供配电系统', points: ['4.1 熟悉供配电系统电压等级选择原则','4.2 熟悉供配电系统接线方式及特点','4.3 熟悉应急电源和备用电源选择及接线方式','4.4 理解电能质量要求及改善措施','4.5 掌握无功补偿设计规定','4.6 熟悉抑制谐波措施','4.7 掌握电压偏差规定及改善措施'],
content: `<h3>一、电压等级选择</h3>
<p>供电电压选择应综合考虑：负荷容量、供电距离、用电设备额定电压、地区电网条件。一般原则：</p>
<ul><li>用电设备容量≤250kW，供电距离≤0.35km：0.38kV</li><li>250kW~8000kW，0.35~10km：6kV或10kV</li><li>8000kW~40000kW，5~20km：35kV</li><li>≥40000kW，10~50km：110kV</li></ul>
<h3>二、供配电系统接线方式</h3>
<p>高压系统常用接线：<b>放射式</b>（可靠性高、操作灵活）、<b>树干式</b>（投资省、可靠性较低）、<b>环式</b>（可靠性较高）。低压系统常用：放射式、树干式、链式。</p>
<h3>三、无功补偿</h3>
<p>无功补偿方式分为<b>集中补偿</b>（变电所高压侧或低压侧）、<b>分组补偿</b>（车间配电室）、<b>就地补偿</b>（电动机旁）。</p>
<div class="formula">补偿容量：Qc = Pjs × (tanφ1 - tanφ2)<br>电容器额定电压选择：考虑串联电抗器后的电压升高，通常选0.525kV或0.48kV</div>
<p>并联电容器组的接线：星形（Y）或三角形（Δ）。高压电容器组宜采用单星形或双星形接线。</p>
<h3>四、谐波抑制</h3>
<p>谐波源：变频器、整流器、电弧炉、气体放电灯等。谐波危害：设备发热、继电保护误动、通信干扰。</p>
<p>抑制措施：加装串联电抗器（电抗率5%、6%、12%、13%）、有源滤波器（APF）、无源滤波器、选用D,yn11接线变压器。</p>
<h3>五、电压偏差</h3>
<p>GB 50052规定：35kV及以上电压偏差不超过±5%；10kV及以下三相供电不超过±7%；220V单相供电+7%~-10%。</p>
<div class="formula">电压偏差(%) = (U - Un)/Un × 100%<br>线路电压损失：ΔU% = (PR + QX)/(10 × Un²) × 100%</div>
<div class="tip">考试重点：无功补偿容量计算（考虑变压器无功损耗）；串联电抗器电抗率选择（5%抑制5次以上谐波，12%-13%抑制3次谐波）；电压损失计算。</div>`
},
{ id: 'gp-5', title: '五、变配电所所址选择及电气设备布置', points: ['5.1 熟悉变配电所所址选择基本要求','5.2 熟悉变配电所布置设计要求','5.3 掌握电气设备布置设计','5.4 理解特殊环境变配电装置设计'],
content: `<h3>一、所址选择基本要求</h3>
<p>根据GB 50053、GB 50059等规范，所址选择应满足：</p>
<ul><li>靠近负荷中心，减少电能损耗和电压损失</li><li>进出线方便，避免交叉</li><li>避开易燃易爆、有腐蚀性气体和粉尘的场所</li><li>地势较高，不受洪水威胁</li><li>与建筑物、构筑物的安全距离符合防火规范</li><li>运输道路畅通，便于设备搬运</li></ul>
<h3>二、变配电所布置</h3>
<p>变配电所一般由<b>高压配电室、变压器室、低压配电室</b>组成。布置应满足：</p>
<ul><li>值班室应便于观察设备运行，宜靠近低压配电室</li><li>变压器室大门应避免朝向露天</li><li>高、低压配电柜的布置方式：单列、双列、面对面、背对背</li></ul>
<h3>三、电气设备布置</h3>
<p>配电装置的最小安全净距：根据GB 50053、GB 50060，按额定电压等级确定A、B、C、D、E值。</p>
<div class="formula">A值：带电部分至接地部分之间（基本安全净距）<br>B值：带电部分至网状遮拦之间（A+100mm）<br>C值：无遮拦裸导体至地面之间（保证人举手不触及）</div>
<p>高压配电柜通道宽度：柜前操作通道（固定式≥1.5m，手车式单车长+1.2m），柜后维护通道≥1.0m。</p>
<h3>四、特殊环境设计</h3>
<p>高海拔地区：海拔超过1000m时，电气设备外绝缘强度降低，应选用高原型设备或加强绝缘。温度校正系数：K = 1/(1.1 - H/10000)，H为海拔高度（m）。</p>
<div class="tip">考试重点：变压器室通风面积计算（按变压器损耗散热）；配电装置安全净距A/B/C值的含义和计算；高海拔地区设备选择的校正。</div>`
},
{ id: 'gp-6', title: '六、短路电流计算', points: ['6.1 掌握短路电流计算方法','6.2 熟悉短路电流计算结果应用','6.3 熟悉影响短路电流因素及限制短路电流措施'],
content: `<h3>一、短路电流计算方法</h3>
<p>低压系统短路电流计算采用<b>欧姆法</b>（有名值法），高压系统采用<b>标幺值法</b>或<b>有名值法</b>。</p>
<h4>1. 高压系统标幺值法</h4>
<div class="formula">基准容量：Sj = 100MVA<br>基准电压：Uj = Up（平均额定电压）<br>基准电流：Ij = Sj/(√3 × Uj)<br>基准电抗：Xj = Uj²/Sj</div>
<p>各元件电抗标幺值：</p>
<ul><li>系统电抗：X*s = Sj/Sd（Sd为系统短路容量）</li><li>变压器电抗：X*T = (Uk%/100) × (Sj/SrT)</li><li>线路电抗：X*L = X0 × L × Sj/Uj²</li></ul>
<h4>2. 低压系统欧姆法</h4>
<div class="formula">三相短路电流：Ik3 = c × Un/(√3 × Zk)<br>其中c为电压系数（计算最大短路电流取1.05，最小取0.95）<br>Zk = √(Rk² + Xk²) 为短路回路总阻抗</div>
<h3>二、短路电流计算结果应用</h3>
<p>短路电流计算用于：<b>电气设备动/热稳定校验</b>、<b>断路器开断能力选择</b>、<b>继电保护整定</b>、<b>导体截面校验</b>、<b>接地装置设计</b>。</p>
<div class="formula">动稳定校验：ish ≤ idyn（ish为短路冲击电流，idyn为设备额定动稳定电流）<br>热稳定校验：Ith² × t ≤ It² × t（或Qk ≤ Ith² × tth）</div>
<h3>三、限制短路电流措施</h3>
<ul><li>变压器分列运行（增大系统阻抗）</li><li>采用高阻抗变压器</li><li>在变压器回路串联电抗器</li><li>采用母线分段运行</li><li>选用限流型断路器或熔断器</li></ul>
<div class="tip">考试重点：标幺值法计算三相短路电流的完整流程；短路冲击电流计算（ish = Ksh × √2 × Ik，Ksh取值1.8-1.3）；电动机反馈电流的影响。</div>`
},
{ id: 'gp-7', title: '七、110kV及以下电气设备选择', points: ['7.1 掌握常用电气设备选择技术条件和环境条件','7.2 熟悉高压变配电设备及电气元件选择','7.3 熟悉低压配电设备及电器元件选择'],
content: `<h3>一、设备选择技术条件</h3>
<p>电气设备选择应满足<b>正常工作条件</b>和<b>短路条件</b>的要求：</p>
<ul><li>额定电压：Ur ≥ Un（系统额定电压）</li><li>额定电流：Ir ≥ Imax（最大持续工作电流）</li><li>额定频率：fr = fn</li><li>绝缘水平：满足系统过电压要求</li></ul>
<p>环境条件：环境温度、海拔、湿度、污秽等级、地震烈度等。</p>
<h3>二、高压设备选择</h3>
<h4>1. 高压断路器</h4>
<p>额定开断电流 ≥ 短路电流有效值；额定关合电流 ≥ 短路冲击电流；额定短时耐受电流 ≥ 短路电流热效应。</p>
<h4>2. 高压隔离开关</h4>
<p>无灭弧能力，仅用于隔离电源、切换小电流回路。选择依据：额定电压、额定电流、动/热稳定电流。</p>
<h4>3. 高压熔断器</h4>
<p>用于变压器、电压互感器、电容器保护。额定电流选择：熔体额定电流 ≥ 回路最大工作电流；额定开断电流 ≥ 最大短路电流。</p>
<h4>4. 电流互感器</h4>
<div class="formula">一次额定电流：I1n ≥ 1.25 × Imax（计量用）或 I1n ≥ 1.5 × Imax（保护用）<br>准确级：计量用0.2S/0.5S级，保护用5P/10P/TPY级<br>二次负荷：S2n ≥ 实际二次负荷</div>
<h3>三、低压设备选择</h3>
<h4>1. 低压断路器</h4>
<p>选择参数：额定电流、分断能力、脱扣特性（B/C/D型曲线）。C型曲线适用于配电线路，D型适用于电动机。</p>
<h4>2. 低压熔断器</h4>
<p>gG型用于一般配电保护，aM型用于电动机短路保护（不保护过载）。</p>
<h4>3. 接触器与热继电器</h4>
<p>接触器额定电流 ≥ 电动机额定电流；热继电器整定电流 = (0.95~1.05) × 电动机额定电流。</p>
<div class="tip">考试重点：高压断路器额定参数与短路电流的匹配校验；电流互感器准确级和二次负荷计算；低压断路器脱扣特性曲线选择。</div>`
},
{ id: 'gp-8', title: '八、35kV及以下导体、电缆及架空线路设计', points: ['8.1 掌握导体选择和设计','8.2 熟悉电线、电缆选择和设计','8.3 熟悉电缆敷设设计','8.4 掌握电缆防火与阻燃设计规定','8.5 理解架空线路设计规定'],
content: `<h3>一、导体选择</h3>
<p>导体类型：硬铜母线（TMY）、硬铝母线（LMY）、软铜绞线（TJ）、钢芯铝绞线（LGJ）。</p>
<p>导体截面选择应满足：<b>载流量</b>、<b>电压损失</b>、<b>经济电流密度</b>、<b>动/热稳定</b>、<b>机械强度</b>。</p>
<div class="formula">按载流量选择：Ixu ≥ Ic（Ixu为校正后的载流量，Ic为计算电流）<br>温度校正系数：Kθ = √[(θm - θa)/(θm - θ0)]<br>多根电缆并列校正系数：查GB 50217附录D</div>
<h3>二、电缆选择</h3>
<p>电缆类型选择：交联聚乙烯（XLPE）电缆（首选）、聚氯乙烯（PVC）电缆、橡皮电缆。</p>
<p>电缆额定电压选择：U0/U（U0为导体对地额定电压，U为相间额定电压）。例如10kV系统选用8.7/10kV电缆。</p>
<h3>三、电缆敷设</h3>
<p>敷设方式：直埋、穿管、电缆沟、电缆隧道、电缆桥架、架空敷设。</p>
<ul><li>直埋敷设：埋深≥0.7m（农田≥1.0m），上下铺砂，盖保护板</li><li>电缆沟：防火隔断每60-100m设置防火墙</li><li>电缆桥架：填充率不超过40%（电力电缆）</li></ul>
<h3>四、电缆防火与阻燃</h3>
<p>防火措施：选用阻燃电缆（ZA/ZB/ZC级）、耐火电缆（N级）、防火涂料、防火包带、防火堵料。</p>
<p>重要回路（消防、应急照明）应采用耐火电缆或矿物绝缘电缆。</p>
<h3>五、架空线路</h3>
<p>导线截面选择：按经济电流密度、载流量、电压损失、机械强度。档距选择：市区≤50m，郊区≤60-80m。</p>
<div class="tip">考试重点：电缆载流量校正系数的综合计算（温度+并列+土壤热阻）；电缆防火措施的选用原则；经济电流密度计算（查表法）。</div>`
},
{ id: 'gp-9', title: '九、变配电所控制、测量、继电保护及自动装置', points: ['9.1 掌握变配电所控制、测量和信号设计规定','9.2 掌握电气设备和线路继电保护配置、整定计算及选型','9.3 理解变配电所自动装置及综合自动化设计规定'],
content: `<h3>一、控制、测量和信号</h3>
<p>控制方式：<b>就地控制</b>（设备旁操作）、<b>远方控制</b>（控制室/集控室）。重要设备应有两者。</p>
<p>测量仪表配置：进线（电流、电压、有功/无功功率、功率因数、电能）、母线（电压）、变压器（电流、温度）、出线（电流、电能）。</p>
<p>信号系统：事故信号（断路器跳闸）、预告信号（设备异常）、位置信号（开关分合闸位置）。</p>
<h3>二、继电保护配置</h3>
<h4>1. 电力线路保护</h4>
<ul><li>过电流保护：动作电流 Idz = Kk × Kjx × Ifh.max / (Kh × Ki)</li><li>电流速断保护：Idz = Kk × Kjx × I''k.max / Ki</li><li>限时电流速断：与下级速断保护配合</li><li>零序电流保护：用于接地故障（TN/TT系统）</li></ul>
<h4>2. 变压器保护</h4>
<ul><li>≥10MVA：纵联差动保护 + 瓦斯保护 + 过负荷保护</li><li>&lt;10MVA：电流速断 + 过电流 + 瓦斯</li><li>温度保护：报警+跳闸</li></ul>
<h4>3. 高压电动机保护</h4>
<ul><li>电流速断保护（≥2000kW加差动保护）</li><li>过负荷保护（反时限特性）</li><li>单相接地保护</li><li>低电压保护</li></ul>
<h3>三、综合自动化</h3>
<p>变配电所综合自动化系统（SAS）将保护、测量、控制、信号集成于一体，通过通信网络与上位机连接。</p>
<div class="tip">考试重点：三段式电流保护整定计算（动作电流、动作时间、灵敏度校验）；变压器差动保护接线方式（Y/Δ变换）；继电保护灵敏度系数计算（Klm = Id.min/Idz ≥ 1.5）。</div>`
},
{ id: 'gp-10', title: '十、变配电所操作电源', points: ['10.1 熟悉直流操作电源设计要求','10.2 熟悉UPS电源设计要求','10.3 理解交流操作电源设计'],
content: `<h3>一、直流操作电源</h3>
<p>直流系统为继电保护、控制回路、信号回路、断路器操作机构等提供可靠电源。常用电压：220V、110V、48V。</p>
<h4>1. 蓄电池选择</h4>
<p>蓄电池型式：阀控式密封铅酸蓄电池（VRLA，最常用）、镍镉蓄电池、磷酸铁锂电池。</p>
<div class="formula">蓄电池容量计算（阶梯法/电压控制法）：<br>Cc = Kk × (I1×t1 + I2×t2 + ...)/(Kd × α)<br>其中Kk为可靠系数（1.25），Kd为容量系数，α为温度系数</div>
<h4>2. 充电装置</h4>
<p>高频开关电源充电装置：具有恒流、恒压、浮充、均充功能。模块数量按N+1冗余配置。</p>
<h4>3. 直流系统接线</h4>
<p>单母线、单母线分段。重要的220V直流系统应采用两段母线，设联络开关。</p>
<h3>二、UPS电源</h3>
<p>UPS用于对电源质量要求高的负荷：计算机系统、DCS、通信设备、应急照明等。</p>
<ul><li>容量选择：Sups ≥ 1.2 × Sload</li><li>后备时间：根据负荷重要性，一般15-30min</li><li>型式：在线式（双变换）、互动式、后备式</li></ul>
<h3>三、交流操作电源</h3>
<p>适用于小型变配电所，利用电压互感器二次侧作为保护电源，交流接触器作为操作电源。</p>
<div class="tip">考试重点：蓄电池容量计算（事故放电时间1h或2h）；充电装置输出电流计算（I = 1.0I10 + Ijc）；UPS容量选择。</div>`
},
{ id: 'gp-11', title: '十一、防雷及过电压保护', points: ['11.1 理解电力系统过电压种类和过电压水平','11.2 熟悉交流电气装置过电压保护设计规定','11.3 掌握建筑物防雷分类及措施','11.4 掌握建筑物防雷和防雷击电磁脉冲设计计算'],
content: `<h3>一、过电压种类</h3>
<p>过电压分为<b>外部过电压</b>（雷电过电压）和<b>内部过电压</b>（操作过电压、工频过电压、谐振过电压）。</p>
<ul><li>雷电过电压：直击雷（幅值高、陡度大）、感应雷</li><li>操作过电压：断路器操作、故障切除、电容器组投切</li><li>工频过电压：单相接地故障、甩负荷、容升效应</li></ul>
<h3>二、建筑物防雷分类</h3>
<p>GB 50057将建筑物防雷分为三类：</p>
<ul><li><b>第一类防雷建筑物</b>：制造、使用或贮存爆炸物质的建筑物，电火花会引起剧烈爆炸</li><li><b>第二类防雷建筑物</b>：国家级重要建筑、大型公共建筑、爆炸危险环境（电火花不易引起爆炸）</li><li><b>第三类防雷建筑物</b>：省级重要建筑、一般民用建筑、年预计雷击次数N≥0.06的建筑物</li></ul>
<div class="formula">年预计雷击次数：N = k × Ng × Ae<br>Ng = 0.1 × Td（Td为年平均雷暴日数）<br>Ae为建筑物等效截收面积</div>
<h3>三、防雷措施</h3>
<p>外部防雷装置：接闪器（避雷针、避雷带、避雷网）、引下线、接地装置。</p>
<p>内部防雷装置：等电位联结、屏蔽、浪涌保护器（SPD）、合理布线。</p>
<div class="formula">避雷针保护半径：rx = √(h(2hr - h)) - √(hx(2hr - hx))<br>hr为滚球半径（一类30m，二类45m，三类60m）</div>
<h3>四、防雷击电磁脉冲（LEMP）</h3>
<p>SPD安装位置：在LPZ0/1区界面（总配电柜）安装一级SPD（Iimp≥12.5kA，10/350μs）；在LPZ1/2区界面安装二级SPD（Imax≥40kA，8/20μs）；在设备前端安装三级SPD。</p>
<div class="tip">考试重点：建筑物防雷分类计算（N值计算）；滚球法计算避雷针保护范围；SPD级间配合（电压保护水平Up≤0.8Uw，Uw为设备耐压）。</div>`
},
{ id: 'gp-12', title: '十二、接地', points: ['12.1 掌握电气装置接地一般规定','12.2 熟悉电气装置保护接地范围','12.3 熟悉电气装置接地装置设计规定','12.4 理解各种接地型式适用范围','12.5 理解接触电压、跨步电压计算方法'],
content: `<h3>一、接地一般规定</h3>
<p>接地按功能分为：<b>工作接地</b>（系统中性点接地）、<b>保护接地</b>（设备外壳接地）、<b>防雷接地</b>、<b>防静电接地</b>、<b>屏蔽接地</b>。</p>
<p>低压系统接地型式：</p>
<ul><li><b>TN-S</b>：N与PE分开，最安全，适用于民用建筑</li><li><b>TN-C</b>：N与PE合一（PEN），不适用于有爆炸危险场所</li><li><b>TN-C-S</b>：前端TN-C，后端TN-S，最常用</li><li><b>TT</b>：设备单独接地，适用于农村、户外</li><li><b>IT</b>：中性点不接地或经高阻接地，适用于医院手术室、矿井</li></ul>
<h3>二、接地装置设计</h3>
<p>接地装置由接地极（垂直接地极、水平接地极）和接地线组成。材料：热镀锌扁钢（-40×4）、热镀锌角钢（∠50×5）、铜包钢等。</p>
<div class="formula">接地电阻计算：<br>垂直接地极：R ≈ ρ/(2πL) × ln(4L/d)<br>水平接地极：R ≈ ρ/(2πL) × ln(L²/(hd))<br>复合接地网：R ≈ 0.5 × ρ/√S + ρ/L</div>
<h3>三、接触电压与跨步电压</h3>
<div class="formula">接触电压：Ut = Is × Rg（人体站立点与设备外壳之间的电位差）<br>跨步电压：Us = Is × ρ/(2π) × (1/x - 1/(x+s))<br>其中s为步距（取1m），x为距接地极距离</div>
<p>允许值：接触电压≤50V（干燥）、≤25V（潮湿）；跨步电压≤ Ut/2。</p>
<h3>四、降低接地电阻措施</h3>
<ul><li>增加接地极数量（并联）</li><li>增加接地极长度</li><li>换土（低电阻率土壤）</li><li>使用降阻剂</li><li>深井接地（深埋接地极）</li></ul>
<div class="tip">考试重点：TN/TT/IT系统适用场景判断；接地电阻计算（复合接地网公式）；接触电压和跨步电压计算及限值。</div>`
},
{ id: 'gp-13', title: '十三、照明', points: ['13.1 理解照明方式和照明种类划分','13.2 熟悉照度标准及照明质量规定','13.3 掌握光源及电气附件选用和灯具选型','13.4 掌握照明供电及照明控制规定','13.5 掌握照度计算基本方法(利用系数法、点照度计算)','13.6 掌握照明工程节能原则及措施'],
content: `<h3>一、照明方式与种类</h3>
<p>照明方式：<b>一般照明</b>（整个场所）、<b>分区一般照明</b>（不同区域不同照度）、<b>局部照明</b>（特定工作点）、<b>混合照明</b>（一般+局部）。</p>
<p>照明种类：<b>正常照明</b>、<b>应急照明</b>（疏散照明、安全照明、备用照明）、<b>值班照明</b>、<b>警卫照明</b>、<b>障碍照明</b>。</p>
<h3>二、照度计算——利用系数法</h3>
<div class="formula">Eav = (N × Φ × U × K) / A<br>其中：N为灯具数量，Φ为光源光通量（lm），U为利用系数，K为维护系数，A为面积（m²）</div>
<p>利用系数U取决于：<b>室形指数RI</b>、<b>表面反射比</b>、<b>灯具配光曲线</b>。</p>
<div class="formula">室形指数：RI = (L × W) / (h × (L + W))<br>h为灯具计算高度 = 层高 - 工作面高度 - 灯具悬挂高度</div>
<h3>三、点照度计算</h3>
<p>用于计算某一点的照度，特别是局部照明、应急照明。</p>
<div class="formula">点光源水平面照度：Eh = Iθ × cos³θ / h²<br>其中Iθ为光源在θ方向的发光强度，h为光源至计算点垂直距离</div>
<h3>四、照明节能</h3>
<p>LPD（照明功率密度）限值：GB 50034规定了各类场所LPD现行值和目标值。</p>
<div class="formula">LPD = P / A （W/m²）<br>P为照明安装功率（含光源、镇流器/驱动电源）</div>
<p>节能措施：选用高效光源（LED、T5/T8荧光灯）、高效灯具（利用系数高）、合理控制（分区、感应、调光）、充分利用自然光。</p>
<div class="tip">考试重点：利用系数法完整计算（确定室形指数→查利用系数→计算灯具数量）；LPD限值校核；点照度计算（角度θ的确定）。</div>`
},
{ id: 'gp-14', title: '十四、电气传动', points: ['14.1 熟悉电气传动系统组成及分类','14.2 理解电动机选择技术要求','14.3 掌握交、直流电动机起动方式及起动校验','14.4 掌握交、直流电动机调速技术','14.5 掌握交、直流电动机电气制动方式及计算','14.6 掌握电动机保护配置及计算措施','14.7 熟悉低压电动机控制电器选择','14.8 熟悉PLC应用'],
content: `<h3>一、电动机选择</h3>
<p>电动机类型选择：笼型异步电动机（结构简单、成本低，首选）、绕线转子异步电动机（起动转矩大、可调速）、同步电动机（功率因数可调、效率高）、直流电动机（调速性能好）。</p>
<p>额定功率选择：PN ≥ PL / (ηL × ηC)，并校验起动转矩、最大转矩。</p>
<h3>二、电动机起动</h3>
<h4>1. 笼型电动机起动</h4>
<ul><li>直接起动：起动电流Ist = (4~7)IN，适用于小功率（≤7.5kW）或电源容量足够大时</li><li>星-三角起动：起动电压降为1/√3，起动电流降为1/3，起动转矩降为1/3</li><li>自耦变压器起动：抽头65%、80%，起动电流和转矩按抽头比平方降低</li><li>软起动器：晶闸管调压，电流斜坡控制</li></ul>
<h4>2. 直流电动机起动</h4>
<p>电枢回路串电阻起动：限制起动电流 Ist ≤ (1.5~2.0)IN。</p>
<h3>三、电动机调速</h3>
<h4>1. 直流电动机调速</h4>
<div class="formula">转速公式：n = (U - IaRa) / (CeΦ)<br>调速方法：调压调速（恒转矩）、调磁调速（恒功率）、串电阻调速（效率低）</div>
<h4>2. 交流电动机调速</h4>
<ul><li>变频调速（VVVF）：最常用，U/f = 常数（恒转矩区），基频以上恒功率</li><li>变极调速：有级调速，2/4/6/8极</li><li>转子串电阻调速：绕线电动机，能耗大</li><li>串级调速：绕线电动机，转子侧加逆变器回馈能量</li></ul>
<h3>四、电气制动</h3>
<ul><li>能耗制动：定子通直流电，转子感应电流产生制动转矩</li><li>反接制动：相序反接，制动电流大，需串电阻限流</li><li>回馈制动：转速超过同步转速时回馈能量</li></ul>
<h3>五、电动机保护</h3>
<ul><li>短路保护：熔断器或断路器瞬时脱扣</li><li>过载保护：热继电器或电子式保护，动作特性与电动机发热曲线匹配</li><li>断相保护：缺相运行时电流增大，需设断相保护</li><li>低电压保护：重要电动机设延时低电压保护</li></ul>
<div class="tip">考试重点：电动机起动方式选择（电源容量校验）；变频器选型（恒转矩/恒功率）；Y-△起动电流和转矩计算；制动电阻计算。</div>`
},
{ id: 'gp-15', title: '十五、建筑智能化', points: ['15.1 掌握火灾自动报警系统及消防联动控制设计','15.2 掌握建筑设备监控系统设计','15.3 掌握安全防范系统设计','15.4 熟悉通信网络及系统设计','15.5 理解有线电视系统设计','15.6 理解扩声和音响系统设计','15.7 理解呼叫系统及公共显示装置设计','15.8 熟悉建筑物内综合布线设计'],
content: `<h3>一、火灾自动报警系统</h3>
<p>系统形式：<b>区域报警系统</b>（小型建筑）、<b>集中报警系统</b>（中型建筑）、<b>控制中心报警系统</b>（大型建筑群）。</p>
<p>火灾探测器选择：</p>
<ul><li>感烟探测器：适用于早期阴燃阶段（办公室、客房、走廊）</li><li>感温探测器：适用于温度变化明显的场所（厨房、锅炉房）</li><li>火焰探测器：适用于明火火灾（油罐区、仓库）</li><li>可燃气体探测器：适用于燃气泄漏报警</li></ul>
<div class="formula">探测器数量：N = S / (K × A)<br>S为探测区域面积，A为探测器保护面积，K为修正系数（高度相关）</div>
<h3>二、消防联动控制</h3>
<p>联动控制对象：消防水泵、喷淋泵、排烟风机、正压送风机、防火卷帘、消防电梯、应急照明、广播等。</p>
<p>控制方式：总线制（最常用）、多线制（重要设备直接控制）。</p>
<h3>三、建筑设备监控系统（BAS）</h3>
<p>监控对象：暖通空调（HVAC）、给排水、供配电、照明、电梯等。</p>
<p>控制方式：DDC（直接数字控制器）+ 上位机监控软件。通信协议：BACnet、LonWorks、Modbus。</p>
<h3>四、安全防范系统</h3>
<p>包括：入侵报警系统、视频监控系统、出入口控制系统（门禁）、电子巡查系统、停车库管理系统。</p>
<h3>五、综合布线</h3>
<p>综合布线系统组成：工作区子系统、水平子系统、垂直干线子系统、管理子系统、设备间子系统、建筑群子系统。</p>
<p>线缆类型：非屏蔽双绞线（UTP，Cat5e/Cat6/Cat6A）、光纤（单模/多模）。</p>
<div class="tip">考试重点：火灾探测器数量和布置计算；消防联动控制逻辑（如两个独立探测器报警+手报→启动消防泵）；综合布线子系统划分。</div>`
},
];

{ id: 'fs-1', title: '一、安全', points: ['1.1 熟悉工程建设标准强制性条文(电力工程部分)','1.2 掌握电力工程电气保护的要求和主要防护措施','1.3 掌握危险环境电力装置的设计要求','1.4 了解劳动、安全、卫生的有关规定'],
content: `<h3>一、电力工程电气保护</h3>
<p>发输变电工程的电气安全保护主要包括：<b>过电流保护</b>、<b>接地保护</b>、<b>防雷保护</b>、<b>绝缘配合</b>、<b>防误操作</b>等。</p>
<p>发电厂和变电站的安全设计应满足DL 5053《火力发电厂职业安全设计规程》等标准要求。</p>
<h3>二、主要防护措施</h3>
<ul><li>高压设备防护：安全净距、围栏、联锁装置</li><li>接地保护：工作接地、保护接地、防雷接地合一的共用接地网</li><li>防误操作："五防"功能（防误分合断路器、防带负荷拉合隔离开关、防带电挂接地线、防带接地线合闸、防误入带电间隔）</li></ul>
<h3>三、危险环境电力装置</h3>
<p>发电厂内存在爆炸危险环境的区域：制氢站、氢冷发电机、油库区、煤粉制备系统等。电气设备防爆型式应根据爆炸性气体混合物分级（ⅡA、ⅡB、ⅡC）和分组选择。</p>
<div class="tip">考试重点：发电厂"五防"联锁设计要求；爆炸危险环境分区与电气设备防爆等级匹配。</div>`
},
{ id: 'fs-2', title: '二、环境保护与节能', points: ['2.1 掌握电力工程对环境的影响及防治措施','2.2 熟悉电力工程的节能措施','2.3 掌握电力工程节能型产品的选用方法','2.4 熟悉提高电能质量的措施','2.5 了解清洁能源发电的特点'],
content: `<h3>一、电力工程对环境影响</h3>
<p>火力发电厂主要环境影响：<b>大气污染</b>（SO₂、NOx、烟尘）、<b>水污染</b>（冷却水排水、化学废水）、<b>噪声</b>（汽轮机、发电机、冷却塔）、<b>固废</b>（粉煤灰、炉渣）、<b>电磁干扰</b>。</p>
<p>防治措施：烟气脱硫脱硝除尘（达到超低排放标准）、废水处理回用、隔声降噪、粉煤灰综合利用。</p>
<h3>二、电力工程节能</h3>
<ul><li>采用超超临界机组（效率≥45%，比亚临界高5-6%）</li><li>汽轮机通流改造</li><li>变频调速（给水泵、引风机、送风机）</li><li>余热利用（烟气余热、循环水余热）</li></ul>
<h3>三、清洁能源发电</h3>
<p>风力发电：陆上风电、海上风电。光伏发电：集中式光伏电站、分布式光伏。核能发电：压水堆、重水堆。水力发电：常规水电、抽水蓄能。</p>
<div class="tip">考试重点：火电厂大气污染物排放限值（超低排放：SO₂≤35mg/m³、NOx≤50mg/m³、烟尘≤10mg/m³）；风电/光伏并网技术要求。</div>`
},
{ id: 'fs-3', title: '三、消防', points: ['3.1 熟悉电气设备消防安全的要求和措施','3.2 掌握电缆防火的要求和措施','3.3 熟悉电力工程火灾报警系统的设计要求'],
content: `<h3>一、电气设备消防安全</h3>
<p>发电厂和变电站的主要火灾危险：变压器油（可燃）、电缆（蔓延快）、蓄电池（氢气）、煤粉（爆炸）。</p>
<p>变压器消防：设置事故油池（容量≥最大单台变压器油量）、固定式灭火系统（水喷雾、细水雾、泡沫）。</p>
<h3>二、电缆防火</h3>
<p>电缆防火措施：</p>
<ul><li>阻燃电缆（ZA/ZB/ZC）或耐火电缆（N级）</li><li>电缆防火涂料、防火包带</li><li>电缆隧道/沟每60-100m设防火墙</li><li>电缆竖井每层封堵</li><li>重要回路分沟敷设或分层敷设</li></ul>
<h3>三、火灾报警系统</h3>
<p>发电厂火灾报警系统应与消防联动控制结合，重要区域设感温/感烟/火焰探测器。主控室、电子设备间应采用吸气式感烟探测器。</p>
<div class="tip">考试重点：变压器事故油池容量计算；电缆隧道防火墙间距；发电厂各区域探测器选型。</div>`
},
{ id: 'fs-4', title: '四、电气主接线', points: ['4.1 掌握电气主接线设计的基本要求(含接入系统设计)','4.2 掌握各级电压配电装置的基本接线设计','4.3 熟悉各种电气主接线型式设计','4.4 掌握主接线设计中的设备配置','4.5 了解发电机及变压器中性点的接地方式'],
content: `<h3>一、主接线基本要求</h3>
<p>电气主接线应满足：<b>可靠性</b>、<b>灵活性</b>、<b>经济性</b>。根据发电厂类型和容量选择：</p>
<ul><li>大型机组（≥300MW）：发电机-变压器单元接线</li><li>中型机组：扩大单元接线或发电机-变压器-线路组接线</li><li>小型机组：单母线或单母线分段</li></ul>
<h3>二、主接线型式</h3>
<table style="font-size:12px;width:100%;margin:.5rem 0;border-collapse:collapse;">
<tr style="background:#f1f5f9"><th>接线型式</th><th>特点</th><th>适用范围</th></tr>
<tr><td>单母线</td><td>简单经济，可靠性低</td><td>小容量发电厂、变电站</td></tr>
<tr style="background:#f8fafc"><td>单母线分段</td><td>可靠性较高，操作灵活</td><td>中容量发电厂</td></tr>
<tr><td>双母线</td><td>可靠性高，可轮流检修</td><td>大容量发电厂、枢纽变电站</td></tr>
<tr style="background:#f8fafc"><td>3/2断路器</td><td>可靠性最高，投资大</td><td>500kV及以上重要变电站</td></tr>
<tr><td>角形接线</td><td>断路器少，闭环运行</td><td>3-5回进出线</td></tr>
</table>
<h3>三、中性点接地方式</h3>
<ul><li>发电机中性点：经消弧线圈接地（≤50MW）、经高阻接地（大机组）、经配电变压器接地</li><li>变压器中性点：直接接地（110kV及以上）、经消弧线圈接地（35kV）、不接地（10kV）</li></ul>
<div class="tip">考试重点：主接线可靠性比较（3/2接线最优）；发电机中性点接地方式选择（电容电流&gt;5A时经消弧线圈接地）；主接线图中断路器/隔离开关配置。</div>`
},
{ id: 'fs-5', title: '五、短路电流计算', points: ['5.1 掌握短路电流的计算方法(实用计算法)','5.2 掌握短路电流计算结果的应用','5.3 熟悉限制短路电流的设计措施'],
content: `<h3>一、实用计算法</h3>
<p>发输变电系统短路电流计算采用<b>实用计算法</b>（运算曲线法或等值电源法）。</p>
<h4>1. 运算曲线法</h4>
<p>将系统中所有电源合并为一个等值电源，查运算曲线得到短路电流标幺值。</p>
<div class="formula">计算步骤：<br>① 选基准容量Sj=100MVA，确定各电压等级基准电压Uj<br>② 计算各元件电抗标幺值（发电机、变压器、线路、电抗器）<br>③ 网络化简，求出短路点总电抗X*Σ<br>④ 计算电抗Xjs = X*Σ × (SN/Sj)<br>⑤ 根据Xjs和短路时间t查运算曲线得I*t<br>⑥ 有名值：It = I*t × IN</div>
<h4>2. 三相短路电流计算</h4>
<div class="formula">起始次暂态电流：I'' = 1/X''dΣ × Ij<br>冲击电流：ish = Ksh × √2 × I''（Ksh通常取1.8-1.9）<br>短路电流最大有效值：Ich = I'' × √(1 + 2(Ksh - 1)²)</div>
<h3>二、短路电流计算结果应用</h3>
<ul><li>断路器开断能力选择（额定开断电流≥I''）</li><li>设备动/热稳定校验</li><li>接地装置设计（最大入地电流）</li><li>继电保护整定</li></ul>
<h3>三、限制短路电流措施</h3>
<ul><li>发电厂母线分段运行</li><li>采用分裂绕组变压器</li><li>在变压器回路串联电抗器</li><li>提高电压等级（降低短路电流）</li></ul>
<div class="tip">考试重点：运算曲线法完整计算流程；Xjs计算（发电机额定容量为基准）；起始次暂态电流与稳态电流的区别。</div>`
},
{ id: 'fs-6', title: '六、设备选择', points: ['6.1 熟悉电气主设备选择的技术条件和环境条件','6.2 熟悉发电机、变压器、电抗器、电容器的选择','6.3 掌握开关电器和保护电器的选择','6.4 掌握电流互感器、电压互感器的选择','6.5 熟悉成套电器的选择','6.6 掌握高压电瓷及金具的选择','6.7 掌握中性点设备的选择','6.8 了解发电机励磁系统的选择'],
content: `<h3>一、变压器选择</h3>
<p>主变压器容量：≥发电机额定容量。台数：一般2台（大型电厂），采用单元接线时每台机组配1台。</p>
<p>阻抗电压选择：Uk%不宜过大（否则电压损失大），也不宜过小（否则短路电流大）。一般：110kV变压器Uk%=10.5%，220kV为12%-14%。</p>
<h3>二、高压断路器选择</h3>
<div class="formula">额定电压：Ur ≥ Un<br>额定电流：Ir ≥ Imax<br>额定开断电流：Ibr ≥ I''（对称短路电流）<br>额定关合电流：Imak ≥ ish<br>额定短时耐受电流：Ith ≥ I''<br>额定峰值耐受电流：Ip ≥ ish</div>
<h3>三、电流互感器选择</h3>
<p>一次额定电流：I1n ≥ 1.25Imax（计量）或 ≥1.5Imax（保护）。</p>
<p>准确级：计量用0.2级或0.2S级；保护用5P、10P、TPY、TPZ级（TPY用于超高压系统）。</p>
<h3>四、电压互感器选择</h3>
<p>型式：电磁式（电容式用于110kV及以上）。二次负荷：S2n ≥ 实际二次负荷。</p>
<h3>五、中性点设备</h3>
<ul><li>消弧线圈：补偿容量Q = 1.35 × Ic × Un/√3（Ic为系统电容电流）</li><li>接地电阻：阻值R = Un/(√3 × Id)（Id为接地电流）</li><li>接地变压器：用于无中性点引出的系统（Z型或YNd接线）</li></ul>
<div class="tip">考试重点：变压器阻抗电压对短路电流的影响；TPY级电流互感器暂态特性；消弧线圈补偿容量计算。</div>`
},
{ id: 'fs-7', title: '七、导体及电缆的设计选择', points: ['7.1 掌握导体的选择及设计要求','7.2 熟悉电缆的选择','7.3 掌握电缆敷设设计要求'],
content: `<h3>一、导体选择</h3>
<p>导体材料：铝（经济性好，密度小）用于架空线和软母线；铜（载流量大、机械强度高）用于硬母线和重要回路。</p>
<p>截面选择应满足：<b>载流量</b>、<b>电晕</b>（110kV及以上校验）、<b>无线电干扰</b>、<b>机械强度</b>、<b>经济电流密度</b>。</p>
<div class="formula">按经济电流密度选择：S = Imax / J<br>J为经济电流密度（查DL/T 5222曲线，与最大负荷利用小时数Tmax有关）<br>当S接近两种标准截面时，宜选较大截面</div>
<h3>二、电缆选择</h3>
<p>高压电缆：交联聚乙烯（XLPE）为主流，额定电压U0/U按系统接地方式选择。</p>
<ul><li>中性点直接接地系统：U0 = 系统相电压（如110kV选64/110kV）</li><li>中性点非有效接地系统：U0 = 系统线电压（如10kV选8.7/10kV）</li></ul>
<h3>三、电缆敷设</h3>
<p>发电厂常用敷设方式：电缆沟、电缆隧道、电缆桥架、穿管、直埋。</p>
<p>电缆沟/隧道排水坡度≥0.5%，设集水井和排水泵。电缆桥架层间距离：电力电缆≥300mm，控制电缆≥200mm。</p>
<div class="tip">考试重点：经济电流密度计算（查曲线法）；电缆额定电压U0的选择（与接地方式相关）；电缆桥架填充率校验。</div>`
},
{ id: 'fs-8', title: '八、电气设备布置及配电装置设计', points: ['8.1 熟悉电气设备布置的要求','8.2 掌握高压配电装置的设计','8.3 了解特殊地区的电气设备布置'],
content: `<h3>一、电气设备布置</h3>
<p>发电厂电气设备布置应满足：运行检修方便、扩建可能、进出线顺畅、防火防爆要求。</p>
<p>主变压器布置：户外布置（经济）或户内布置（城市变电站）。油浸变压器与建筑物防火间距≥10m。</p>
<h3>二、高压配电装置</h3>
<p>配电装置型式：</p>
<ul><li><b>中型布置</b>：断路器位于母线和设备之间，占地面积大，投资低</li><li><b>半高型布置</b>：断路器抬高或母线抬高，节省占地</li><li><b>高型布置</b>：母线和设备上下重叠，占地最小，检修不便</li><li><b>GIS（气体绝缘金属封闭开关设备）</b>：SF6绝缘，占地极小，可靠性高，投资大</li></ul>
<h3>三、安全净距</h3>
<div class="formula">A1值：带电部分至接地部分之间<br>A2值：不同相带电部分之间<br>B1值：带电部分至栅栏之间（A1+750mm）<br>C值：无遮拦裸导体至地面之间（保证人举手不触及）</div>
<p>海拔超过1000m时，A值应乘以校正系数Ka = 1/(1.1 - H/10000)。</p>
<div class="tip">考试重点：中型/半高型/高型/GIS布置的特点比较；海拔校正后安全净距计算；GIS设备布置的优点。</div>`
},
{ id: 'fs-9', title: '九、过电压保护和绝缘配合', points: ['9.1 熟悉电力系统过电压种类和过电压水平','9.2 掌握雷电过电压的特点及相应的限制和保护','9.3 掌握暂时过电压的特点及相应的限制和保护','9.4 掌握操作过电压的特点及相应的限制和保护','9.5 了解输电线路、配电装置及电气设备的绝缘配合'],
content: `<h3>一、过电压种类</h3>
<p><b>雷电过电压</b>：直击雷（幅值高，可达数百kV~MV级）、感应雷。<b>内部过电压</b>：工频过电压（单相接地、甩负荷）、操作过电压（合闸、重合闸、切除空载线路）、谐振过电压。</p>
<h3>二、雷电过电压保护</h3>
<p>发电厂和变电站防雷：</p>
<ul><li>直击雷防护：避雷针、避雷线（保护范围按滚球法或折线法计算）</li><li>侵入波防护：在进线段架设避雷线（1-2km），在母线安装避雷器（MOA）</li></ul>
<div class="formula">避雷器保护距离：Lm = (Ub - Us)/ (2 × α)<br>Ub为避雷器残压，Us为设备耐压，α为侵入波陡度</div>
<h3>三、操作过电压</h3>
<p>主要类型：空载线路合闸过电压、切除空载变压器过电压、电弧接地过电压。</p>
<p>限制措施：并联电抗器（补偿线路电容，降低合闸过电压）、合闸电阻断路器、MOA避雷器。</p>
<h3>四、绝缘配合</h3>
<p>绝缘配合原则：根据系统最高运行电压、过电压水平、设备重要性，确定设备的绝缘水平。</p>
<div class="formula">雷电冲击耐受电压：BIL = k1 × Uw<br>操作冲击耐受电压：SIL = k2 × Uw<br>其中k1、k2为配合系数（考虑绝缘老化、海拔等）</div>
<div class="tip">考试重点：避雷器保护距离计算；MOA额定电压选择（≥系统最大工作电压）；操作过电压倍数（相对地≤3.0p.u.）。</div>`
},
{ id: 'fs-10', title: '十、接地', points: ['10.1 熟悉电气接地的设计','10.2 了解直流输电系统接地的基本要求','10.3 熟悉高土壤电阻率地区接地设计','10.4 掌握接地电阻、接触电位差、跨步电位差的计算'],
content: `<h3>一、接地设计</h3>
<p>发电厂和变电站采用<b>共用接地网</b>：将工作接地、保护接地、防雷接地合并为一个接地装置。</p>
<p>接地装置由水平接地极（扁钢或圆钢）和垂直接地极（角钢或钢管）组成，在接地网边缘闭合。</p>
<h3>二、接地电阻计算</h3>
<div class="formula">接地网接地电阻（简化公式）：R ≈ 0.5ρ/√S<br>ρ为土壤电阻率（Ω·m），S为接地网面积（m²）</div>
<p>允许接地电阻值：</p>
<ul><li>有效接地系统（110kV及以上）：R ≤ 2000/I（I为入地短路电流，A），且R≤0.5Ω</li><li>非有效接地系统：R ≤ 120/I，且R≤4Ω（共用接地网）</li></ul>
<h3>三、接触电位差与跨步电位差</h3>
<div class="formula">允许接触电位差：Ut = (174 + 0.17ρf)/√t<br>允许跨步电位差：Us = (174 + 0.7ρf)/√t<br>ρf为表层土壤电阻率，t为短路持续时间</div>
<h3>四、高土壤电阻率地区</h3>
<p>降阻措施：扩大接地网面积、深井接地、换土、使用降阻剂、水下接地网。</p>
<div class="tip">考试重点：接地电阻简化计算（R=0.5ρ/√S）；接触/跨步电位差允许值计算（查表法或公式法）；高土壤电阻率地区降阻措施选择。</div>`
},
{ id: 'fs-11', title: '十一、仪表和控制', points: ['11.1 熟悉控制方式的设计选择','11.2 熟悉二次设备的布置设计','11.3 掌握二次回路的设计要求','11.4 熟悉电气系统采用计算机监控的设计','11.5 了解二次设备及控制电缆抗干扰的要求'],
content: `<h3>一、控制方式</h3>
<p>发电厂控制方式：<b>主控制室控制</b>（老厂）、<b>单元控制室控制</b>（现代大型火电厂）、<b>网络控制室控制</b>（升压站）、<b>就地控制</b>（辅助设备）。</p>
<h3>二、二次回路设计</h3>
<p>二次回路包括：控制回路、信号回路、测量回路、保护回路、自动装置回路。</p>
<p>控制回路电压：直流220V或110V。跳合闸回路应设监视（灯光监视或音响监视）。</p>
<h3>三、计算机监控</h3>
<p>DCS（分散控制系统）：用于发电厂机炉电主设备控制。NCS（网络监控系统）：用于升压站和输电线路监控。</p>
<p>通信接口：IEC 61850（变电站通信网络和系统标准），实现设备互操作。</p>
<h3>四、抗干扰措施</h3>
<ul><li>控制电缆选用屏蔽电缆（铜带屏蔽或编织屏蔽）</li><li>强弱电回路分缆敷设</li><li>电缆屏蔽层两端接地</li><li>继电器线圈并联续流二极管</li></ul>
<div class="tip">考试重点：DCS与NCS的分工范围；控制回路监视方式；IEC 61850标准的核心内容（面向对象建模）。</div>`
},
{ id: 'fs-12', title: '十二、继电保护、安全自动装置及调度自动化', points: ['12.1 掌握线路、母线和断路器继电保护的配置、整定计算','12.2 熟悉电气主设备继电保护的配置、整定计算','12.3 了解安全自动装置的原理及配置','12.4 了解电力系统调度自动化的功能及配置'],
content: `<h3>一、线路保护</h3>
<p>输电线路主保护：<b>纵联保护</b>（光纤差动、高频闭锁、高频允许），实现全线速动。后备保护：距离保护（三段式）、零序电流保护。</p>
<div class="formula">距离保护阻抗整定：<br>Ⅰ段：Zdz1 = Kk × ZAB（Kk=0.8-0.85），瞬时动作<br>Ⅱ段：Zdz2 = Kk × (ZAB + Kk' × ZBCmin)，延时0.3-0.5s<br>Ⅲ段：Zdz3 = Kk × Zfh.max（按最大负荷阻抗整定），延时1-2s</div>
<h3>二、母线保护</h3>
<p>母线保护配置：差动保护（完全差动、不完全差动）。对于双母线，应设大差（总差动）和小差（各母线差动）。</p>
<p>母联断路器充电保护：利用母联断路器对母线充电时投入，充电正常后退出。</p>
<h3>三、主设备保护</h3>
<p>发电机保护：差动保护（主保护）、匝间保护、接地保护（95%定子接地+100%定子接地）、失磁保护、失步保护、过负荷保护。</p>
<p>变压器保护：差动保护（主保护）、瓦斯保护、过负荷保护、温度保护。</p>
<h3>四、安全自动装置</h3>
<ul><li>自动重合闸：单相重合闸、三相重合闸、综合重合闸</li><li>备用电源自动投入（BZT）</li><li>自动低频减载（UFLS）</li><li>失步解列</li></ul>
<div class="tip">考试重点：距离保护三段整定计算（含灵敏度校验Klm≥1.5）；发电机差动保护接线方式（中性点侧和机端侧CT变比匹配）；自动重合闸与保护配合。</div>`
},
{ id: 'fs-13', title: '十三、直流系统', points: ['13.1 熟悉直流系统的设计要求','13.2 掌握蓄电池的选择及容量计算','13.3 掌握充电器的选择及容量计算','13.4 掌握直流设备的选择和布置设计','13.5 了解直流系统绝缘监测装置的选择'],
content: `<h3>一、直流系统设计要求</h3>
<p>发电厂直流系统电压：220V（控制、保护、信号）、110V（弱电控制）、48V（通信）。</p>
<p>直流系统接线：单母线、单母线分段（两段母线设联络开关，正常运行分列运行）。</p>
<h3>二、蓄电池容量计算</h3>
<p>计算方法：<b>阶梯计算法</b>（DL/T 5044推荐）或<b>电压控制法</b>。</p>
<div class="formula">阶梯计算法：<br>Cc = Kk × [I1/Kc1 + (I2-I1)/Kc2 + (I3-I2)/Kc3 + ...]<br>Kk=1.25（可靠系数），Kc为容量换算系数（与放电时间和终止电压有关）<br>事故放电时间：有人值班1h，无人值班2h</div>
<h3>三、充电器选择</h3>
<div class="formula">充电器额定电流：I = 1.0I10 + Ijc<br>I10为蓄电池10h率放电电流，Ijc为经常负荷电流</div>
<p>高频开关电源模块数量：n = I/Ie + 1（N+1冗余，Ie为单模块额定电流）。</p>
<h3>四、直流设备布置</h3>
<p>蓄电池室：通风良好（防爆风机），温度保持5-30℃，地面耐酸，设事故排酸设施。</p>
<div class="tip">考试重点：蓄电池容量阶梯计算法（事故放电初期1min冲击+持续放电）；充电器模块N+1配置；蓄电池室设计要点。</div>`
},
{ id: 'fs-14', title: '十四、发电厂和变电所用电', points: ['14.1 熟悉厂(所)用电负荷的分类、电压选择','14.2 掌握厂(所)用电接线要求、备用方式和负荷配置','14.3 掌握厂(所)用电系统的计算和设备选择','14.4 熟悉厂(所)用电设备布置设计','14.5 了解保安电源系统的设计','14.6 掌握UPS的选择'],
content: `<h3>一、厂用电负荷分类</h3>
<p>按重要性分为：<b>Ⅰ类负荷</b>（短时停电影响安全，如给水泵、引风机，需双电源自动切换）、<b>Ⅱ类负荷</b>（允许短时停电，如输煤皮带）、<b>Ⅲ类负荷</b>（长时间停电无影响，如检修电源）。</p>
<p>厂用电电压等级：高压厂用电（6kV或10kV，大容量电动机）、低压厂用电（380V，小容量设备和照明）。</p>
<h3>二、厂用电接线</h3>
<p>高压厂用电接线：按锅炉分段（每台锅炉设一段高压厂用母线），由高压厂用变压器供电。每台锅炉至少配2台高压厂用变压器（互为备用）。</p>
<p>低压厂用电接线：按炉或按区域分段，由低压厂用变压器供电。重要负荷设双电源自动切换。</p>
<h3>三、厂用电设备选择</h3>
<div class="formula">高压厂用变压器容量：St ≥ ΣPe × Kx<br>Pe为电动机额定功率，Kx为需要系数（一般0.7-0.8）</div>
<p>电动机自起动校验：厂用母线电压降应满足：Ut ≥ (1.1~1.2) × Umin（Umin为电动机最低起动电压）。</p>
<h3>四、UPS选择</h3>
<p>容量：Sups ≥ 1.2 × ΣSload。型式：在线式双变换UPS。后备时间：30min（蓄电池供电）。</p>
<div class="tip">考试重点：厂用电接线按炉分段原则；高压厂用变压器容量计算；电动机自起动时母线电压校验；UPS容量选择。</div>`
},
{ id: 'fs-15', title: '十五、照明', points: ['15.1 熟悉发电厂、变电所照明系统的设计要求','15.2 熟悉照明系统的供电方式','15.3 掌握照明设备的选择','15.4 掌握照度计算的基本方法','15.5 了解绿色照明的特点'],
content: `<h3>一、发电厂照明设计</h3>
<p>照明种类：正常照明、事故照明（应急照明）、障碍照明。事故照明应由独立电源（直流或UPS）供电。</p>
<p>主要场所照度标准：主控制室300-500lx，配电装置室200lx，变压器室100lx，厂区道路5-15lx。</p>
<h3>二、照明设备选择</h3>
<p>光源：LED（首选，寿命长、效率高）、金卤灯（高大厂房）、高压钠灯（道路）。</p>
<p>灯具：防护等级（IP代码），户外IP65，潮湿场所IP54，防爆场所ExdIIBT4。</p>
<h3>三、照度计算</h3>
<div class="formula">利用系数法：Eav = (N × Φ × U × K) / A<br>点光源法：Eh = Iθ × cos³θ / h²</div>
<p>维护系数K：一般室内0.7-0.8，室外0.65-0.75。</p>
<h3>四、绿色照明</h3>
<p>LPD限值：主厂房≤7-9W/m²，控制室≤9-11W/m²。采用分区控制、光控/时控、调光技术。</p>
<div class="tip">考试重点：发电厂事故照明供电要求；照度计算（利用系数法查表）；灯具防护等级选择。</div>`
},
{ id: 'fs-16', title: '十六、输电线路', points: ['16.1 熟悉输电线路路径的选择','16.2 掌握输电线路导、地线的选择','16.3 掌握输电线路电气参数的计算','16.4 了解杆塔塔头设计','16.5 了解输电线路对电信线路的影响及防护','16.6 掌握电线力学特性的计算','16.7 熟悉各种杆塔荷载的一般规定及计算','16.8 熟悉杆塔的定位校验','16.9 了解电线的防振'],
content: `<h3>一、导线选择</h3>
<p>导线截面选择应满足：<b>载流量</b>、<b>电晕</b>、<b>无线电干扰</b>、<b>机械强度</b>、<b>经济电流密度</b>。</p>
<div class="formula">按经济电流密度选择：S = Imax / J<br>J查DL/T 5222曲线（铝导体：Tmax=5000h时J≈1.15A/mm²）</div>
<p>导线型号：LGJ（钢芯铝绞线，常用）、LGJF（防腐型）、LGKK（扩径导线）。</p>
<h3>二、线路电气参数</h3>
<div class="formula">正序电抗：X1 = 0.1445 × lg(Dm/r') + 0.0157 (Ω/km)<br>零序电抗：X0 ≈ (3~3.5)X1<br>正序电纳：b1 = 7.58/lg(Dm/r) × 10⁻⁶ (S/km)<br>其中Dm为三相导线几何均距，r'为导线等效半径</div>
<h3>三、电线力学计算</h3>
<p>架空线状态方程（考虑温度变化和荷载变化时导线应力变化）：</p>
<div class="formula">σm - (γm² × l² × E)/(24 × σm²) = σn - (γn² × l² × E)/(24 × σn²) - α × E × (tm - tn)</div>
<p>其中σ为应力，γ为比载，l为档距，E为弹性系数，α为线膨胀系数。</p>
<h3>四、杆塔荷载</h3>
<p>荷载类型：<b>垂直荷载</b>（导线、地线、覆冰自重）、<b>水平横向荷载</b>（风压）、<b>水平纵向荷载</b>（张力差、转角张力）。</p>
<div class="formula">风荷载：W = α × μz × μs × βc × d × Lh × V²/1600<br>α为风速不均匀系数，μz为风压高度变化系数，μs为体型系数，βc为风载调整系数</div>
<h3>五、防振措施</h3>
<p>微风振动：安装防振锤（Stockbridge型）、阻尼线。舞动：加装防舞装置（偏心重锤、相间间隔棒）。</p>
<div class="tip">考试重点：导线经济截面计算（经济电流密度法）；架空线状态方程应用；最大弧垂计算（最高气温或最大比载）；风荷载计算。</div>`
},
{ id: 'fs-17', title: '十七、电力系统规划设计', points: ['17.1 了解电力系统规划设计的内容和方法','17.2 了解电力系统安全稳定运行的基本要求','17.3 熟悉无功补偿型式选择及容量计算','17.4 了解电力系统中性点接地方式','17.5 熟悉电力系统短路容量及设备选择'],
content: `<h3>一、电力系统规划</h3>
<p>电力系统规划包括：<b>电源规划</b>（电源结构、容量、布局）、<b>电网规划</b>（电压等级、网架结构、输电容量）、<b>负荷预测</b>（弹性系数法、回归分析法、时间序列法）。</p>
<p>电力平衡：系统装机容量 = 系统最大负荷 + 备用容量（负荷备用2%-5%、事故备用10%、检修备用8%-15%）。</p>
<h3>二、系统安全稳定</h3>
<p>稳定分类：<b>静态稳定</b>（小扰动稳定，储备系数≥15%-20%）、<b>暂态稳定</b>（大扰动后第一摆稳定）、<b>动态稳定</b>（考虑自动调节装置作用）。</p>
<div class="formula">静态稳定储备系数：Kp = (Pmax - P0)/P0 × 100%<br>Pmax为输送功率极限，P0为正常运行输送功率</div>
<h3>三、无功补偿</h3>
<p>无功补偿方式：<b>发电机调相运行</b>、<b>并联电容器</b>、<b>并联电抗器</b>（吸收无功，用于高压长线路）、<b>同步调相机</b>、<b>SVC/STATCOM</b>。</p>
<div class="formula">并联电抗器容量选择：QL = Qc - Qfh<br>Qc为线路充电功率，Qfh为负荷无功需求</div>
<h3>四、短路容量</h3>
<p>短路容量（短路功率）：Sk = √3 × Uk × Ik，反映系统强度。短路容量越大，系统电压稳定性越好，但短路电流越大。</p>
<p>限制短路容量措施：母线分段、高阻抗变压器、串联电抗器、采用直流输电。</p>
<div class="tip">考试重点：电力平衡计算（备用容量配置）；静态稳定储备系数计算；并联电抗器容量选择（超高压线路充电功率补偿）；短路容量与系统强度的关系。</div>`
},
];

function escapeHtml(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function toast(msg, type='info') {
  const t = document.createElement('div');
  const colors = {info:'bg-slate-800', success:'bg-emerald-600', error:'bg-red-500'};
  t.className = `fixed top-20 left-1/2 -translate-x-1/2 ${colors[type]} text-white text-sm px-4 py-2 rounded-lg shadow-lg z-50 fade-in`;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2500);
}

function biliEmbedUrl(bvid, page){return `https://player.bilibili.com/player.html?bvid=${bvid}&page=${page||1}&high_quality=1&danmaku=0&autoplay=0`;}

}

function go(view){
  currentView=view;
  document.querySelectorAll('.tab-btn').forEach(b=>{
    const active=b.dataset.tab===view;
    b.classList.toggle('border-blue-600',active);b.classList.toggle('text-blue-700',active);b.classList.toggle('font-medium',active);
    b.classList.toggle('border-transparent',!active);b.classList.toggle('text-slate-500',!active);
  });
  if(view==='home') renderHome();
  else if(view==='chapters') renderChapters();
  else if(view==='live') renderLive();
  else if(view==='papers') renderPastPapers();
  else if(view==='manuals') renderManuals();
  else if(view==='notes') renderNotes();
}
function onSearch(v){searchKw=v.trim().toLowerCase(); go(currentView);}

// ============ 章节知识 ============
function renderChapters(){
  const app=document.getElementById('app');
  app.innerHTML=`
    <div class="fade-in">
      <div class="flex items-center gap-2 mb-4">
        <button onclick="switchProType('gongpei')" class="pro-tab ${currentProType==='gongpei'?'pro-tab-active':'pro-tab-inactive'}">供配电专业</button>
        <button onclick="switchProType('fasong')" class="pro-tab ${currentProType==='fasong'?'pro-tab-active':'pro-tab-inactive'}">发输变电专业</button>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
        <div class="md:col-span-1 space-y-1 bg-white rounded-xl border border-slate-100 p-3 max-h-[70vh] overflow-y-auto scroll-thin">
          ${getChaptersForType().map(c=>`
            <div class="chapter-item ${currentChapterId===c.id?'active':''}" onclick="openChapter('${c.id}')">
              <div class="font-medium text-sm">${escapeHtml(c.title)}</div>
              <div class="text-[10px] text-slate-400 mt-0.5">${c.points.length} 个考点</div>
            </div>`).join('')}
        </div>
        <div class="md:col-span-3">${renderChapterDetail()}</div>
      </div>
    </div>`;
}
function getChaptersForType(){
  let list=currentProType==='gongpei'?gongpeiChapters:fasongChapters;
  if(searchKw) list=list.filter(c=>c.title.toLowerCase().includes(searchKw)||c.points.some(p=>p.toLowerCase().includes(searchKw))||((c.content||'').toLowerCase().includes(searchKw)));
  return list;
}
function switchProType(type){currentProType=type; currentChapterId=null; renderChapters();}
function openChapter(id){currentChapterId=id; renderChapters();}
function renderChapterDetail(){
  const list=getChaptersForType();
  const ch=list.find(c=>c.id===currentChapterId);
  if(!ch){const first=list[0]; if(first){currentChapterId=first.id; return renderChapterDetail();} return `<div class="bg-white rounded-xl border border-slate-100 p-8 text-center text-slate-400">选择左侧章节查看详细考点</div>`;}
  const notes=myNotes['chapter:'+ch.id]||'';
  const status=progressMap['chapter:'+ch.id]||'';
  return `
    <div class="bg-white rounded-xl border border-slate-100 p-5">
      <div class="flex items-center justify-between mb-3 flex-wrap gap-2">
        <h2 class="text-lg font-bold">${escapeHtml(ch.title)}</h2>
        <div class="flex gap-1">
          ${['planned','learning','done'].map(st=>{
            const labels={planned:'📋 计划',learning:'📖 学习中',done:'✅ 已学完'};
            const colors={planned:'bg-slate-100 text-slate-600',learning:'bg-blue-100 text-blue-700',done:'bg-emerald-100 text-emerald-700'};
            const cur=status===st;
            return `<button onclick="setStatus('chapter:${ch.id}','${st}')" class="text-xs px-2 py-1 rounded ${colors[st]} ${cur?'font-bold ring-2 ring-offset-1 ring-blue-300':''}">${labels[st]}</button>`;
          }).join('')}
        </div>
      </div>
      <div class="content-box mb-4">${ch.content||'<p class="text-slate-400">暂无详细内容</p>'}</div>
      <div class="border-t border-slate-100 pt-4">
        <div class="flex items-center justify-between mb-2">
          <h3 class="font-bold text-sm">📝 学习笔记</h3>

              <h3 class="font-bold text-sm">📄 ${getPaperYear(id)}年${paper.category}${paper.time}${paper.type} · PDF对照</h3>
              <div class="flex gap-2">
                <button onclick="switchPdfViewer('${paper.id}','google','${paper.pdfUrl}')" id="btn-google-${paper.id}" class="text-xs px-2 py-1 rounded bg-blue-50 border border-blue-300 font-medium">Google预览</button>
                <button onclick="switchPdfViewer('${paper.id}','direct','${paper.pdfUrl}')" id="btn-direct-${paper.id}" class="text-xs px-2 py-1 rounded bg-white border border-slate-200 hover:bg-slate-50">直接预览</button>
              </div>
            </div>
            <div id="pdfWrap-${paper.id}" class="w-full" style="height:600px;">
              <iframe id="pdfFrame-${paper.id}" src="https://docs.google.com/gview?embedded=1&url=${encodeURIComponent(paper.pdfUrl)}" class="w-full h-full border-0"></iframe>
            </div>
            <div id="pdfFallback-${paper.id}" class="hidden p-8 text-center">
              <div class="text-4xl mb-3">📄</div>
              <p class="text-sm text-slate-600 mb-2">PDF 预览暂时无法加载</p>
              <p class="text-xs text-slate-400 mb-4">正在尝试直接预览方式…</p>
              <button onclick="switchPdfViewer('${paper.id}','direct','${paper.pdfUrl}')" class="px-4 py-2 rounded-lg bg-blue-600 text-white text-sm hover:bg-blue-700">切换到直接预览</button>
            </div>
          </div>

          <div class="bg-white rounded-xl border border-slate-100 p-4">
            <h3 class="font-bold text-sm mb-3">试卷信息</h3>
            <div class="grid grid-cols-2 gap-3 text-sm">
              <div><span class="text-slate-400 text-xs">考试类别：</span><span>${escapeHtml(paper.category)}</span></div>
              <div><span class="text-slate-400 text-xs">时段：</span><span>${escapeHtml(paper.time)}</span></div>
              <div><span class="text-slate-400 text-xs">题型：</span><span>${escapeHtml(paper.type)}</span></div>
              <div><span class="text-slate-400 text-xs">题量：</span><span>${escapeHtml(paper.questions)}</span></div>
              <div><span class="text-slate-400 text-xs">视频讲师：</span><span>${escapeHtml(paper.videoTeacher)}</span></div>
              <div><span class="text-slate-400 text-xs">时长：</span><span>${paper.duration} 分钟</span></div>
            </div>
          </div>
          <div class="bg-white rounded-xl border border-slate-100 p-4">
            <h3 class="font-bold text-sm mb-3">学习状态</h3>
            <div class="flex gap-2 flex-wrap">
              ${['planned','learning','done'].map(st=>{
                const labels={planned:'📋 计划学习',learning:'📖 学习中',done:'✅ 已学完'};
                const colors={planned:'border-slate-300 text-slate-600 hover:bg-slate-50',learning:'border-blue-500 text-blue-600 bg-blue-50',done:'border-emerald-500 text-emerald-600 bg-emerald-50'};
                const cur=status===st;
                return `<button onclick="setStatus('paper:${paper.id}','${st}')" class="text-sm px-4 py-2 rounded-lg border ${colors[st]} ${cur?'font-bold':''}">${labels[st]}</button>`;
              }).join('')}
            </div>
          </div>
        </div>
        <div class="lg:col-span-1 space-y-4">
          <!-- 同年份试卷导航 -->
          <div class="bg-white rounded-xl border border-slate-100 p-4 sticky top-20">
            <h3 class="font-bold text-sm mb-3">📑 ${getPaperYear(id)}年同卷导航</h3>
            <div class="space-y-1.5 max-h-48 overflow-y-auto scroll-thin">
              ${getYearPapers(id).map(p=>`
                <div onclick="openPaperDetail('${p.id}')" class="cursor-pointer px-2.5 py-1.5 rounded-lg text-xs ${p.id===id?'bg-amber-50 border border-amber-200 text-amber-800 font-medium':'bg-slate-50 text-slate-600 hover:bg-slate-100 border border-transparent'}">
                  <div class="flex items-center gap-1.5">
                    <span class="text-[10px] px-1 rounded ${p.category==='供配电'?'bg-blue-100 text-blue-700':'bg-indigo-100 text-indigo-700'}">${p.category}</span>
                    <span>${p.time}</span>
                    <span class="text-slate-400">${p.type}</span>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
          <!-- 学习笔记 -->
          <div class="bg-white rounded-xl border border-slate-100 p-4 sticky top-32">
            <div class="flex items-center justify-between mb-2">
              <h3 class="font-bold text-sm">📝 学习笔记</h3>
            </div>
            <textarea id="noteArea" oninput="onNoteInput('paper:${paper.id}')" rows="12" placeholder="记录真题解题思路、公式推导、易错点…&#10;自动保存到本地。" class="w-full text-sm p-3 rounded-lg border border-slate-200 focus:border-blue-400 outline-none resize-y">${escapeHtml(notes)}</textarea>
            <div class="text-[10px] text-slate-400 mt-1 flex justify-between">
              <span id="noteStatus-paper:${paper.id}"></span>
              <span>${notes.length} 字</span>
            </div>
            <div class="mt-3 pt-3 border-t border-slate-100">
              <div class="text-xs text-slate-500 mb-2">💡 备考建议</div>
              <p class="text-xs text-slate-500 leading-relaxed">建议按年份从新到旧练习，先做当年真题检验水平，再对照视频讲解查漏补缺。重点关注最近3年的命题趋势。</p>
            </div>
          </div>
        </div>
      </div>
    </div>`;
}
function getPaperYear(id){
  const m=id.match(/^p(\d+)/);
  return m?('20'+m[1]):'';
}
function getYearPapers(currentId){
  const year=getPaperYear(currentId);
  if(!year) return [];
  const yObj=pastPapersData.find(y=>y.year===parseInt(year));
  return yObj?yObj.papers:[];
}

function switchPdfViewer(pid, mode, url){
  const frame=document.getElementById('pdfFrame-'+pid);
  const wrap=document.getElementById('pdfWrap-'+pid);
  const fallback=document.getElementById('pdfFallback-'+pid);
  const btnDirect=document.getElementById('btn-direct-'+pid);
  const btnGoogle=document.getElementById('btn-google-'+pid);
  if(!frame) return;
  // reset buttons
  if(btnDirect){btnDirect.classList.remove('font-medium','bg-blue-50','border-blue-300'); btnDirect.classList.add('bg-white','border-slate-200');}
  if(btnGoogle){btnGoogle.classList.remove('font-medium','bg-blue-50','border-blue-300'); btnGoogle.classList.add('bg-white','border-slate-200');}
  // show iframe, hide fallback
  if(wrap) wrap.classList.remove('hidden');
  if(fallback) fallback.classList.add('hidden');
  if(mode==='google'){
    frame.src='https://docs.google.com/gview?embedded=1&url='+encodeURIComponent(url);
    if(btnGoogle){btnGoogle.classList.add('font-medium','bg-blue-50','border-blue-300'); btnGoogle.classList.remove('bg-white','border-slate-200');}
  } else {
    frame.src=url;
    if(btnDirect){btnDirect.classList.add('font-medium','bg-blue-50','border-blue-300'); btnDirect.classList.remove('bg-white','border-slate-200');}
  }
}
function onPdfError(pid){
  const wrap=document.getElementById('pdfWrap-'+pid);
  const fallback=document.getElementById('pdfFallback-'+pid);
  if(wrap) wrap.classList.add('hidden');
  if(fallback) fallback.classList.remove('hidden');
}

// ============ 考试手册 ============

    <div class="fade-in">
      <h2 class="text-xl font-bold mb-4">考试手册</h2>
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 mb-6">
        <div>
          <h3 class="font-bold mb-3 text-sm">🏫 权威培训机构</h3>
          <div class="space-y-2">
            ${manualsData.map(m=>`
              <div class="bg-white rounded-xl border border-slate-100 p-4 flex items-center gap-3">
                <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-slate-700 to-slate-900 flex items-center justify-center text-white font-bold text-lg flex-shrink-0">${m.logo}</div>
                <div class="flex-1 min-w-0">
                  <div class="flex items-center gap-2">
                    <span class="font-bold text-slate-800">${escapeHtml(m.name)}</span>
                    <span class="text-[10px] px-1.5 py-0.5 bg-blue-50 text-blue-600 rounded">${escapeHtml(m.platform)}</span>
                  </div>
                  <p class="text-xs text-slate-500 mt-0.5 line-clamp-1">${escapeHtml(m.desc)}</p>

                    <a href="${escapeHtml(m.url)}" target="_blank" rel="noopener" class="text-[10px] text-blue-600 hover:underline">访问 →</a>
                  </div>

          </div>
        </div>
        <div>

          <div class="space-y-2">

              <div class="bg-white rounded-xl border border-slate-100 p-3 flex items-center justify-between">

        💡 <strong>备考建议：</strong>以上规范为注册电气工程师专业考试必考内容，建议在官方渠道购买正版规范。考试时可携带纸质规范手册进入考场。

// ============ 我的笔记 ============
function renderNotes(){
  const app=document.getElementById('app');
  const entries=Object.entries(myNotes).filter(([k,v])=>v&&v.trim());
  let filtered=searchKw?entries.filter(([k,v])=>v.toLowerCase().includes(searchKw)||k.toLowerCase().includes(searchKw)):entries;
  app.innerHTML=`
    <div class="fade-in">
      <h2 class="text-xl font-bold mb-4">我的学习笔记 <span class="text-sm text-slate-400 font-normal">（${filtered.length} 条）</span></h2>
      ${filtered.length===0?`<div class="text-center py-16 text-slate-400">还没有笔记，去章节知识或直播课程中边学边记笔记吧</div>`:
        `<div class="space-y-2">${filtered.map(([k,v])=>{
          const label=k.startsWith('chapter:')?'📚 章节':k.startsWith('live:')?'🎬 课程':k.startsWith('paper:')?'📚 真题':'📝';
          const title=k.replace('chapter:','').replace('live:','').replace('paper:','');
          return `<div class="bg-white rounded-xl border border-slate-100 p-4 cursor-pointer hover:border-blue-200" onclick="jumpToNote('${k}')">
            <div class="flex items-center gap-2 mb-1">
              <span class="text-xs">${label}</span>
              <h3 class="font-medium text-sm">${escapeHtml(title)}</h3>
            </div>
            <p class="text-xs text-slate-500 line-clamp-3">${escapeHtml(v.slice(0,200))}</p>
          </div>`;
        }).join('')}</div>`}
    </div>`;
}
function jumpToNote(key){
  const [type,id]=key.split(':');
  if(type==='chapter') openChapter(id);
  else if(type==='live') openLiveDetail(id);
  else if(type==='paper') openPaperDetail(id);
}

// ============ 笔记自动保存 ============
let noteTimer=null;
function onNoteInput(key){
  const area=document.getElementById('noteArea');
  if(!area) return;
  const statusEl=document.getElementById('noteStatus-'+key);
  if(statusEl){statusEl.textContent='保存中…'; statusEl.className='text-[10px] text-amber-500';}
  myNotes[key]=area.value;
  clearTimeout(noteTimer);
  noteTimer=setTimeout(()=>{saveNotes(); if(statusEl){statusEl.textContent='已保存 · '+new Date().toLocaleTimeString(); statusEl.className='text-[10px] text-emerald-500';}},600);
}

// ============ 学习状态 ============
function setStatus(key,status){
  progressMap[key]=status;
  saveProgress();
  toast('学习状态已更新：'+({planned:'计划学习',learning:'学习中',done:'已学完'}[status]),'success');
  if(currentView==='chapters') renderChapterDetail();
  else if(currentView==='live'){if(currentLiveId) openLiveDetail(currentLiveId); else renderLive();}
  else if(currentView==='papers'){if(currentPaperId) openPaperDetail(currentPaperId); else renderPastPapers();}
}

// ============ 启动 ============
loadData();
go('home');
</script>
