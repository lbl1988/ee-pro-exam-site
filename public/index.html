// ============ 工具函数 ============
function escapeHtml(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function toast(msg, type='info') {
  const t = document.createElement('div');
  const colors = {info:'bg-slate-800', success:'bg-emerald-600', error:'bg-red-500'};
  t.className = `fixed top-20 left-1/2 -translate-x-1/2 ${colors[type]} text-white text-sm px-4 py-2 rounded-lg shadow-lg z-50 fade-in`;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2500);
}

function go(view) {
  currentView = view;
  document.querySelectorAll('.tab-btn').forEach(b => {
    const active = b.dataset.tab === view;
    b.classList.toggle('border-blue-600', active);
    b.classList.toggle('text-blue-700', active);
    b.classList.toggle('font-medium', active);
    b.classList.toggle('border-transparent', !active);
    b.classList.toggle('text-slate-500', !active);
  });
  if (view==='home') renderHome();
  else if (view==='chapters') renderChapters();
  else if (view==='live') renderLive();
  else if (view==='manuals') renderManuals();
  else if (view==='notes') renderNotes();
}

    list = list.filter(c => c.title.toLowerCase().includes(searchKw) || c.points.some(p => p.toLowerCase().includes(searchKw)));
  }
  return list;
}

function switchProType(type) {
  currentProType = type;
  currentChapterId = null;
  renderChapters();
}

  currentChapterId = id;

  const list = getChaptersForType();

        <div class="flex gap-2 flex-wrap text-xs">
          <button onclick="setFilter('category','all')" class="px-3 py-1.5 rounded-lg border ${currentCategory==='all'?'bg-blue-600 text-white border-blue-600':'border-slate-200 hover:bg-slate-50'}">全部</button>
          <button onclick="setFilter('category','供配电')" class="px-3 py-1.5 rounded-lg border ${currentCategory==='供配电'?'bg-blue-600 text-white border-blue-600':'border-slate-200 hover:bg-slate-50'}">供配电</button>
          <button onclick="setFilter('category','发输变电')" class="px-3 py-1.5 rounded-lg border ${currentCategory==='发输变电'?'bg-blue-600 text-white border-blue-600':'border-slate-200 hover:bg-slate-50'}">发输变电</button>
        </div>
      </div>
      <div class="flex gap-2 flex-wrap text-xs mb-4">
        <button onclick="setFilter('level','all')" class="px-3 py-1.5 rounded-lg border ${currentLevel==='all'?'bg-slate-700 text-white border-slate-700':'border-slate-200 hover:bg-slate-50'}">全部级别</button>
        <button onclick="setFilter('level','basic')" class="px-3 py-1.5 rounded-lg border ${currentLevel==='basic'?'bg-blue-600 text-white border-blue-600':'border-slate-200 hover:bg-slate-50'}">基础班</button>
        <button onclick="setFilter('level','advanced')" class="px-3 py-1.5 rounded-lg border ${currentLevel==='advanced'?'bg-purple-600 text-white border-purple-600':'border-slate-200 hover:bg-slate-50'}">精讲班</button>
        <button onclick="setFilter('level','sprint')" class="px-3 py-1.5 rounded-lg border ${currentLevel==='sprint'?'bg-amber-600 text-white border-amber-600':'border-slate-200 hover:bg-slate-50'}">冲刺班</button>
      </div>
      ${list.length === 0
        ? `<div class="text-center py-16 text-slate-400">暂无符合条件的课程</div>`
        : `<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">${list.map(c => liveCard(c, levels, levelColors)).join('')}</div>`}
    </div>`;
}

function setFilter(type, val) {
  if (type === 'category') currentCategory = val;
  else if (type === 'level') currentLevel = val;
  renderLive();
}

function liveCard(c, levels, levelColors) {
  const status = progressMap['live:'+c.id] || '';
  const statusBadge = status==='done'?'<span class="text-[10px] px-1.5 py-0.5 rounded bg-emerald-100 text-emerald-700">✓ 已学完</span>':status==='learning'?'<span class="text-[10px] px-1.5 py-0.5 rounded bg-blue-100 text-blue-700">● 学习中</span>':'';
  const duration = c.duration ? `${Math.floor(c.duration/60)}分` : '';
  return `
    <div class="card-hover bg-white rounded-xl border border-slate-100 overflow-hidden cursor-pointer" onclick="openLiveDetail('${c.id}')">
      <div class="bg-slate-900 aspect-video flex items-center justify-center relative">
        <img src="https://i0.hdslb.com/bfs/archive/${c.bvid}.jpg" onerror="this.style.display='none';this.parentNode.innerHTML+='<div class=\\'text-white/50 text-3xl\\'>▶</div>'" class="w-full h-full object-cover"/>
        <div class="absolute inset-0 flex items-center justify-center bg-black/20">
          <div class="w-14 h-14 rounded-full bg-white/80 flex items-center justify-center text-slate-800 text-2xl">▶</div>
        </div>
        <div class="absolute bottom-2 right-2 text-white text-xs bg-black/60 px-2 py-0.5 rounded">${duration}</div>
      </div>
      <div class="p-4">
        <div class="flex items-start justify-between gap-2 mb-2">
          <div class="flex-1 min-w-0">
            <div class="text-sm font-medium text-slate-800 line-clamp-2">${escapeHtml(c.title)}</div>
          </div>
          <span class="text-[10px] px-2 py-1 rounded ${levelColors[c.level]||'bg-slate-100 text-slate-600'} whitespace-nowrap">${levels[c.level]||c.level}</span>
        </div>
        <div class="flex items-center gap-2 text-xs text-slate-500 mb-2 flex-wrap">
          <span>👨‍🏫 ${escapeHtml(c.teacher)}</span>
          <span class="px-1.5 py-0.5 bg-slate-100 rounded">${escapeHtml(c.category)}</span>
          ${statusBadge}
        </div>
        <p class="text-xs text-slate-400 line-clamp-2">${escapeHtml(c.description)}</p>
      </div>
    </div>`;
}

function openLiveDetail(id) {
  const c = liveCourses.find(x => x.id === id);
  if (!c) return;
  currentLiveId = id;
  const app = document.getElementById('app');
  const notes = myNotes['live:'+c.id] || '';
  const status = progressMap['live:'+c.id] || '';
  app.innerHTML = `
    <div class="fade-in">
      <button onclick="go('live')" class="text-sm text-slate-500 hover:text-blue-600 mb-3">← 返回课程列表</button>
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-5">
        <div class="lg:col-span-2 space-y-4">
          <div>
            <h2 class="text-lg font-bold">${escapeHtml(c.title)}</h2>
            <div class="flex items-center gap-3 mt-2 text-xs text-slate-500 flex-wrap">
              <span>👨‍🏫 ${escapeHtml(c.teacher)}</span>
              <span class="px-2 py-0.5 bg-slate-100 rounded">${escapeHtml(c.category)}</span>
              <span>📺 B站直播课</span>
            </div>
          </div>
          ${renderBiliPlayer(c.bvid, c.page)}
          <div class="bg-white rounded-xl border border-slate-100 p-4">
            <h3 class="font-bold text-sm mb-2">课程介绍</h3>
            <p class="text-sm text-slate-600 leading-relaxed">${escapeHtml(c.description)}</p>
          </div>
          <div class="bg-white rounded-xl border border-slate-100 p-4">
            <h3 class="font-bold text-sm mb-3">学习状态</h3>
            <div class="flex gap-2 flex-wrap">
              ${['planned','learning','done'].map(st => {
                const labels = {planned:'📋 计划学习',learning:'📖 学习中',done:'✅ 已学完'};
                const colors = {planned:'border-slate-300 text-slate-600 hover:bg-slate-50',learning:'border-blue-500 text-blue-600 bg-blue-50',done:'border-emerald-500 text-emerald-600 bg-emerald-50'};
                const cur = status===st;
                return `<button onclick="setStatus('live:${c.id}','${st}')" class="text-sm px-4 py-2 rounded-lg border ${colors[st]} ${cur?'font-bold':''}">${labels[st]}</button>`;
              }).join('')}
            </div>
          </div>
        </div>
        <div class="lg:col-span-1">
          <div class="bg-white rounded-xl border border-slate-100 p-4 sticky top-32">
            <div class="flex items-center justify-between mb-2">
              <h3 class="font-bold text-sm">📝 学习笔记</h3>
            </div>
            <textarea id="noteArea" oninput="onNoteInput('live:${c.id}')" rows="12" placeholder="记录本节课的知识点、公式、疑问…&#10;自动保存到本地。" class="w-full text-sm p-3 rounded-lg border border-slate-200 focus:border-blue-400 outline-none resize-y">${escapeHtml(notes)}</textarea>
            <div class="text-[10px] text-slate-400 mt-1 flex justify-between">
              <span id="noteStatus-live:${c.id}"></span>
              <span>${notes.length} 字</span>
            </div>
          </div>
        </div>
      </div>
    </div>`;
}

// ============ 考试手册 ============
function renderManuals() {
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="fade-in">
      <h2 class="text-xl font-bold mb-4">考试手册</h2>
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 mb-6">
        <div>
          <h3 class="font-bold mb-3 text-sm">🏫 权威培训机构</h3>
          <div class="space-y-2">
            ${manualsData.map(m => `
              <div class="bg-white rounded-xl border border-slate-100 p-4 flex items-center gap-3">
                <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-slate-700 to-slate-900 flex items-center justify-center text-white font-bold text-lg flex-shrink-0">${m.logo}</div>
                <div class="flex-1 min-w-0">
                  <div class="flex items-center gap-2">
                    <span class="font-bold text-slate-800">${escapeHtml(m.name)}</span>
                    <span class="text-[10px] px-1.5 py-0.5 bg-blue-50 text-blue-600 rounded">${escapeHtml(m.platform)}</span>
                  </div>
                  <p class="text-xs text-slate-500 mt-0.5 line-clamp-1">${escapeHtml(m.desc)}</p>
                  <div class="flex items-center gap-2 mt-1">
                    <span class="text-[10px] px-1.5 py-0.5 bg-slate-100 text-slate-600 rounded">${escapeHtml(m.tag)}</span>
                    <a href="${escapeHtml(m.url)}" target="_blank" rel="noopener" class="text-[10px] text-blue-600 hover:underline">访问 →</a>
                  </div>
                </div>
              </div>`).join('')}
          </div>
        </div>
        <div>
          <h3 class="font-bold mb-3 text-sm">📋 核心规范标准</h3>
          <div class="space-y-2">
            ${standardManuals.map(s => `
              <div class="bg-white rounded-xl border border-slate-100 p-3 flex items-center justify-between">
                <div>
                  <div class="font-mono text-sm text-blue-700 font-bold">${escapeHtml(s.name)}</div>
                  <p class="text-xs text-slate-500 mt-0.5">${escapeHtml(s.title)}</p>
                </div>
                <span class="text-[10px] px-2 py-0.5 bg-emerald-50 text-emerald-600 rounded whitespace-nowrap">${escapeHtml(s.category)}</span>
              </div>`).join('')}
          </div>
        </div>
      </div>
      <div class="bg-amber-50 border border-amber-200 rounded-xl p-4 text-xs text-amber-800">
        💡 <strong>备考建议：</strong>以上规范为注册电气工程师专业考试必考内容，建议在官方渠道购买正版规范。考试时可携带纸质规范手册进入考场。
      </div>
    </div>`;
}

// ============ 我的笔记 ============
function renderNotes() {
  const app = document.getElementById('app');
  const entries = Object.entries(myNotes).filter(([k,v]) => v && v.trim());
  if (searchKw) {
    const kw = searchKw;
    var filtered = entries.filter(([k,v]) => v.toLowerCase().includes(kw) || k.toLowerCase().includes(kw));
  } else {
    var filtered = entries;
  }
  app.innerHTML = `
    <div class="fade-in">
      <h2 class="text-xl font-bold mb-4">我的学习笔记 <span class="text-sm text-slate-400 font-normal">（${filtered.length} 条）</span></h2>
      ${filtered.length===0 ? `<div class="text-center py-16 text-slate-400">还没有笔记，去章节知识或直播课程中边学边记笔记吧</div>` :
        `<div class="space-y-2">${filtered.map(([k,v]) => {
          const label = k.startsWith('chapter:') ? '📚 章节' : k.startsWith('live:') ? '🎬 课程' : '📝';
          const title = k.replace('chapter:','').replace('live:','');
          return `<div class="bg-white rounded-xl border border-slate-100 p-4 cursor-pointer hover:border-blue-200" onclick="jumpToNote('${k}')">
            <div class="flex items-center justify-between mb-1">
              <div class="flex items-center gap-2">
                <span class="text-xs">${label}</span>
                <h3 class="font-medium text-sm">${escapeHtml(title)}</h3>
              </div>
            </div>
            <p class="text-xs text-slate-500 line-clamp-3">${escapeHtml(v.slice(0,200))}</p>
          </div>`;
        }).join('')}</div>`}
    </div>`;
}

function jumpToNote(key) {
  const [type, id] = key.split(':');
  if (type === 'chapter') { currentProType = currentProType; openChapter(id); }
  else if (type === 'live') { openLiveDetail(id); }
}

// ============ 笔记自动保存 ============
let noteTimer = null;
function onNoteInput(key) {
  const area = document.getElementById('noteArea');
  if (!area) return;
  const statusEl = document.getElementById('noteStatus-' + key);
  if (statusEl) { statusEl.textContent = '保存中…'; statusEl.className='text-[10px] text-amber-500'; }
  myNotes[key] = area.value;
  clearTimeout(noteTimer);
  noteTimer = setTimeout(() => {
    saveNotes();
    if (statusEl) { statusEl.textContent='已保存 · '+new Date().toLocaleTimeString(); statusEl.className='text-[10px] text-emerald-500'; }
  }, 600);
}

// ============ 学习状态 ============
function setStatus(key, status) {
  progressMap[key] = status;
  saveProgress();
  toast('学习状态已更新：' + ({planned:'计划学习',learning:'学习中',done:'已学完'}[status]), 'success');
  if (currentView === 'chapters') renderChapterDetail();
  else if (currentView === 'live') {
    if (currentLiveId) openLiveDetail(currentLiveId);
    else renderLive();
  }
}

// ============ 启动 ============
loadData();
go('home');
</script>
</body>
</html>
